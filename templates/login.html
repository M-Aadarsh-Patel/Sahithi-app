<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
{% include "_style.html" %}
<style>
  body { max-width: 23rem; margin: 0 auto; padding-top: 3.5rem; }

  h1 {
    margin: 0 0 1.7rem;
    font-size: 1.5rem; font-weight: 630; letter-spacing: -.026em;
  }

  .profiles {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: .6rem; margin-bottom: 1.1rem;
  }
  .profiles label {
    display: flex; align-items: center; justify-content: center;
    min-height: 3.5rem;
    background: var(--card); color: var(--ink-soft);
    border: 1px solid var(--line-strong); border-radius: 10px;
    font-weight: 550; cursor: pointer;
    box-shadow: var(--edge), var(--lift);
    transition: background-color .14s ease, border-color .14s ease,
                color .14s ease, transform .1s ease;
  }
  .profiles label:active { transform: scale(.98); }
  /* Off-screen rather than display:none, so the radio stays keyboard-reachable
     and announced by screen readers. */
  .profiles input { position: absolute; opacity: 0; }
  .profiles label:has(input:checked) {
    background: var(--green); border-color: var(--green); color: #fff;
  }
  .profiles label:has(input:focus-visible) {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  #password {
    width: 100%; min-height: var(--tap);
    padding: 0 .85rem; margin-bottom: .8rem;
    background: rgba(0, 0, 0, .3); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 10px;
    transition: border-color .14s ease, box-shadow .14s ease;
  }
  #password::placeholder { color: var(--ink-faint); }
  #password:focus {
    outline: none; border-color: var(--focus); box-shadow: var(--focus-ring);
  }

  #signin {
    width: 100%; min-height: 3rem;
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); border-radius: 10px;
    font-size: 1rem; font-weight: 640; letter-spacing: -.005em; cursor: pointer;
    box-shadow: var(--lift);
    transition: transform .1s ease, opacity .14s ease;
  }
  #signin:active { transform: scale(.985); opacity: .9; }

  /* Amber, not the rose used for absent. A wrong password is a correctable
     mistake, and it should not wear the same colour as a student's record. */
  .error {
    margin: 0 0 1.1rem; padding: .7rem .85rem;
    background: var(--amber-tint); color: var(--amber);
    border-left: 3px solid var(--amber);
    border-radius: var(--radius-sm); font-size: .92rem;
  }
</style>

<h1>HR Academy</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  {# Radios, not submit buttons. Two submit buttons gave the form a default one,
     so pressing Enter silently signed in as whoever came first in the markup. #}
  <div class="profiles">
    <label><input type="radio" name="username" value="sahithi" required>Sahithi</label>
    <label><input type="radio" name="username" value="nithya" required>Nithya</label>
  </div>
  <input id="password" type="password" name="password" placeholder="Password" required>
  <button id="signin" type="submit">Sign in</button>
</form>
