{% if heading_font %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
{% endif %}
{% if icons %}
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
{% endif %}
<style>
  :root {
    --paper:          #100f0e;
    --card:           #1c1a18;
    --ink:            #f2efe9;
    --ink-soft:       #b3aca1;
    --ink-faint:      #8b8377;
    --line:           #2f2c28;
    --line-strong:    #6b655a;

    --green:          #37854e;
    --green-tint:     #16261a;
    --terracotta:     #bd4a66;
    --terracotta-tint:#1a0b0f;

    --amber:          #d9a441;
    --amber-tint:     #2a2113;

    --font-heading:   "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --focus:          #6ba3d0;
    --focus-ring:     0 0 0 3px rgba(107, 163, 208, .22);

    --edge:           inset 0 1px 0 rgba(255, 255, 255, .05);
    --lift:           0 1px 2px rgba(0, 0, 0, .45),
                      0 6px 20px rgba(0, 0, 0, .22);
    --glow-green:     0 2px 10px rgba(55, 133, 78, .30),
                      inset 0 1px 0 rgba(255, 255, 255, .12);
    --glow-rose:      0 2px 10px rgba(189, 74, 102, .32),
                      inset 0 1px 0 rgba(255, 255, 255, .12);
    --glow-amber:     0 2px 10px rgba(217, 164, 65, .28),
                      inset 0 1px 0 rgba(255, 255, 255, .12);
    --glow-brand:     rgba(237, 28, 36, .10);

    --ease:           cubic-bezier(.22, .61, .36, 1);
    --dur:            .16s;
    --dur-enter:      .28s;

    --radius:         12px;
    --radius-sm:      9px;
    --tap:            44px;
  }

  :root { color-scheme: dark; }

  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    scrollbar-color: var(--line-strong) transparent;
    scrollbar-width: thin;
  }

  body {
    margin: 0;
    padding:
      1.1rem
      max(1rem, env(safe-area-inset-right))
      calc(2.5rem + env(safe-area-inset-bottom))
      max(1rem, env(safe-area-inset-left));
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: clip;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed;
    left: 50%; top: -6svh;
    width: min(52rem, 160vw); height: 46svh;
    transform: translateX(-50%);
    background: radial-gradient(closest-side,
                  rgba(255, 232, 200, .045),
                  transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
  body { animation: page-in .2s ease-out; }

  input, textarea, button, summary { font: inherit; color: inherit; }
  input, textarea { font-size: max(1rem, 16px); caret-color: var(--focus); }

  ::selection { background: rgba(107, 163, 208, .3); color: var(--ink); }

  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--ink);
    -webkit-box-shadow: 0 0 0 1000px var(--card) inset;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
</style>
