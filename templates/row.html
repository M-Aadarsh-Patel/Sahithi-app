{# data-status is the last state the server confirmed. The class is what is on
   screen, which a tap changes before the save lands — so a failed save has
   something true to revert to rather than the guess it just painted. #}
<li id="row-{{ student._id }}"
    class="row is-{{ status or 'unmarked' }}"
    data-status="{{ status or 'unmarked' }}"
    hx-target="#row-{{ student._id }}"
    hx-swap="outerHTML"
    {# Both buttons inherit this and resolve "closest li" to this same row, so a
       second tap aborts the first tap's request instead of racing it. Without it
       two POSTs are in flight at once and the one that lands last wins, which is
       not necessarily the one she tapped last. Aborting fires htmx:sendAbort, not
       htmx:sendError, so a superseded tap does not mark the row failed. #}
    hx-sync="closest li:replace"
    hx-vals='{"student_id": "{{ student._id }}", "date": "{{ date }}"}'>
  <span class="name">{{ student.name }}</span>
  <span class="roll">{{ student.roll_no }}</span>
  <button class="present" onclick="optimistic(this, 'present')"
          hx-post="/entries" hx-vals='{"status": "present"}'>present</button>
  <button class="absent" onclick="optimistic(this, 'absent')"
          hx-post="/entries" hx-vals='{"status": "absent"}'>absent</button>
  <button class="retry" type="button">retry</button>
  {% if saved %}<span class="tick">✓</span>{% endif %}
</li>
