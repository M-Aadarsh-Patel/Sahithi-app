<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
{% include "_style.html" %}
<style>
  body {
    max-width: 23rem; margin: 0 auto;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3rem;
    padding-top: 2rem;
    padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    background: #0a0908;
    text-align: center;
  }

  h1 { margin: 0; font-family: var(--font-heading); }
  .logo {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .6));
  }


  body::before {
    content: "";
    position: fixed;
    left: 50%; top: 38svh;
    width: min(48rem, 150vw); height: auto; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(closest-side,
        rgba(242, 239, 233, .07),
        rgba(217, 164, 65, .045) 45%,
        transparent 72%),
      radial-gradient(closest-side,
        rgba(237, 28, 36, .045),
        transparent 68%);
    pointer-events: none;
    z-index: -1;
    animation: lamp 1.1s var(--ease) both;
  }

  @keyframes lamp {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.72); }
    55%  { opacity: 1; }
    100% { opacity: .62; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes mark-in {
    from { opacity: 0; transform: translateY(14px) scale(.985);
           filter: blur(9px) drop-shadow(0 8px 22px rgba(0, 0, 0, .6)); }
    to   { opacity: 1; transform: none;
           filter: blur(0) drop-shadow(0 8px 22px rgba(0, 0, 0, .6)); }
  }
  @keyframes lift-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .logo     { animation: mark-in .7s var(--ease) backwards; }
  .profiles { animation: lift-in .5s var(--ease) .30s backwards; }
  #password { animation: lift-in .5s var(--ease) .37s backwards; }
  #signin   { animation: lift-in .5s var(--ease) .44s backwards; }


  .retry .logo, .retry .profiles, .retry #password, .retry #signin {
    animation: none;
  }
  .retry::before { animation: none; opacity: .62; }


  .sr-only {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }

  form { display: flex; flex-direction: column; gap: 1.5rem; }
  .credentials { display: flex; flex-direction: column; gap: .5rem; }

  .profiles {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: .5rem;
  }
  .profiles label {
    display: flex; align-items: center; justify-content: center;
    min-height: 3.5rem;
    background: var(--card); color: var(--ink-soft);
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    font-weight: 600; cursor: pointer;
    box-shadow: var(--edge), var(--lift);
    transition: background-color var(--dur) ease, border-color var(--dur) ease,
                color var(--dur) ease, box-shadow var(--dur) ease,
                transform .1s ease;
  }
  @media (hover: hover) {
    .profiles label:not(:has(input:checked)):hover {
      color: var(--ink); border-color: var(--ink-faint);
    }
    #signin:hover { transform: translateY(-1px); }
  }
  .profiles label:active { transform: scale(.98); }
  .profiles input { position: absolute; opacity: 0; }
  .profiles label:has(input:checked) {
    background: var(--green); border-color: var(--green); color: #fff;
    box-shadow: var(--lift), var(--glow-green);
  }
  .profiles label:has(input:focus-visible) {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  #password {
    width: 100%; min-height: 3rem;
    padding: 0 .85rem;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    box-shadow: var(--edge), var(--lift);
    text-align: center;
    transition: border-color var(--dur) ease, box-shadow var(--dur) ease;
  }
  #password::placeholder { color: var(--ink-faint); }
  #password:focus {
    outline: none; border-color: var(--focus); box-shadow: var(--focus-ring);
  }
  @keyframes wrong-field {
    0%, 100% { border-color: var(--line-strong); }
    18%, 65% { border-color: var(--amber); }
  }
  .retry #password { animation: wrong-field .9s ease .1s backwards; }
  #password:focus { animation: none; }

  #signin {
    position: relative; overflow: hidden;
    width: 100%; min-height: 3rem;
    background: linear-gradient(180deg, #ffffff, var(--ink)); color: var(--paper);
    border: 1px solid var(--ink); border-radius: var(--radius-sm);
    font-size: 1rem; font-weight: 600; letter-spacing: -.005em; cursor: pointer;
    box-shadow: var(--lift), inset 0 1px 0 rgba(255, 255, 255, .55);
    transition: transform .1s ease, opacity .14s ease;
  }
  #signin:active { transform: scale(.985); opacity: .9; }

  #signin::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
                  transparent 32%, rgba(16, 15, 14, .16) 50%, transparent 68%);
    opacity: 0;
  }
  .sending #signin { pointer-events: none; }
  .sending #signin::after { opacity: 1; animation: sweep 1.05s linear infinite; }
  @keyframes sweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  .error {
    margin: 0; padding: .7rem .85rem;
    background: var(--amber-tint); color: var(--amber);
    border: 1px solid rgba(217, 164, 65, .35);
    border-radius: var(--radius-sm); font-size: .92rem;
    animation: flag-in .3s var(--ease) backwards;
  }
  @keyframes flag-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, .logo, .profiles, #password, #signin,
    .error, .sending #signin::after { animation: none; }
    body::before { opacity: .62; }
    .sending #signin { opacity: .72; }
  }
</style>

<body{% if error %} class="retry"{% endif %}>

<h1><img class="logo" src="/static/logo.png" alt="HR Academy" width="1036" height="381"></h1>
<form method="post" action="/login">
  <div class="credentials">
    {% if error %}<p class="error" id="login-error">{{ error }}</p>{% endif %}
    <fieldset class="profiles">
      <legend class="sr-only">Who is signing in?</legend>
      <label><input type="radio" name="username" value="sahithi" required>Sahithi</label>
      <label><input type="radio" name="username" value="nithya" required>Nithya</label>
    </fieldset>
    <label class="sr-only" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Password"
           autocomplete="current-password" required
           {% if error %}aria-describedby="login-error"{% endif %}>
  </div>
  <button id="signin" type="submit">Sign in</button>
</form>

<script>
  document.querySelector('form').addEventListener('submit', () => {
    document.body.classList.add('sending');
    document.getElementById('signin').setAttribute('aria-busy', 'true');
  });
  addEventListener('pageshow', () => {
    document.body.classList.remove('sending');
    document.getElementById('signin').removeAttribute('aria-busy');
  });
</script>
