<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Academy</title>
{% set heading_font = true %}
{% set icons = true %}
{% include "_style.html" %}
<style>
  body { max-width: 30rem; margin: 0 auto; }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 1rem;
    padding-bottom: 1.15rem;
    margin: 0 0 1.3rem;
    border-bottom: 1px solid transparent;
    border-image: linear-gradient(90deg,
                    transparent, var(--line) 14%, var(--line) 86%, transparent) 1;
  }

  .logo { grid-row: 1; grid-column: 1; display: block; width: 120px; height: auto; }

  .logout {
    grid-row: 1; grid-column: 2; justify-self: end;
    display: inline-flex; align-items: center; min-height: var(--tap);
    padding: 0 .7rem; margin-right: -.7rem;
    border-radius: var(--radius-sm);
    color: var(--ink-soft); text-decoration: none;
    font-size: .9rem; font-weight: 600;
    transition: color .14s ease, background-color .14s ease;
  }
  .logout:active { color: var(--ink); background: rgba(255, 255, 255, .07); }

  h1 {
    grid-row: 2; grid-column: 1 / -1;
    margin: .9rem 0 0;
    font-family: var(--font-heading);
    font-size: 2.125rem; font-weight: 700; letter-spacing: -.03em;
    line-height: 1.1;
  }

  .who {
    grid-row: 3; grid-column: 1 / -1;
    margin: .3rem 0 0;
    font-size: 1.0625rem; color: var(--ink-soft);
  }

  .meta {
    grid-row: 4; grid-column: 1 / -1;
    margin: .5rem 0 0;
    display: flex; align-items: center; gap: .4rem;
    font-size: .8125rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .meta .ti { font-size: 1rem; }

  .tiles { display: grid; gap: .7rem; margin: 0; }
  .tile {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    column-gap: .85rem;
    padding: 1rem 1.1rem;
    border-radius: var(--radius);
    text-decoration: none;
  }
  .tile .ti:first-child {
    display: flex; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem;
    font-size: 1.3rem;
    border-radius: var(--radius-sm);
  }
  .tile .ti { font-size: 1.5rem; }
  .tile-text { min-width: 0; }
  .tile-title {
    display: block;
    font-family: var(--font-heading);
    font-size: 1rem; font-weight: 500; letter-spacing: -.01em; line-height: 1.2;
  }
  .tile-sub {
    display: block; margin-top: .1rem;
    font-size: .8125rem; line-height: 1.2; color: var(--ink-faint);
  }

  a.tile {
    background: linear-gradient(180deg,
                  rgba(255, 255, 255, .028), rgba(255, 255, 255, 0) 55%),
                var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-left: 4px solid var(--green);
    box-shadow: var(--edge), var(--lift);
    transition: transform .1s ease, border-color .14s ease;
  }
  @media (hover: hover) {
    a.tile:hover {
      border-color: var(--line-strong);
      border-left-color: var(--green);
      transform: translateY(-1px);
    }
    .logout:hover { color: var(--ink); }
  }
  a.tile:active { transform: scale(.985); }
  a.tile .ti:first-child {
    color: var(--green);
    background: var(--green-tint);
    box-shadow: inset 0 0 0 1px rgba(55, 133, 78, .30);
  }
  a.tile .ti-chevron-right {
    font-size: 1.15rem; color: var(--ink-faint);
    transition: transform .14s var(--ease);
  }
  a.tile:active .ti-chevron-right { transform: translateX(2px); }

  .soon {
    background: rgba(0, 0, 0, .18); color: var(--ink-soft);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line);
    cursor: default;
  }
  .soon .ti { color: var(--ink-faint); }
  .soon .ti:first-child {
    background: rgba(255, 255, 255, .045);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05);
  }
  .soon .tile-title { color: var(--ink-soft); font-weight: 500; }
  .soon-chip {
    font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint);
    background: rgba(255, 255, 255, .06);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    border-radius: 999px; padding: .24rem .5rem .2rem;
  }

  @keyframes header-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes tile-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  header { animation: header-in .3s var(--ease) backwards; }
  .tile { animation: tile-in .34s var(--ease) backwards; }
  .tile:nth-child(2) { animation-delay: .06s; }
  .tile:nth-child(3) { animation-delay: .12s; }

  @media (prefers-reduced-motion: reduce) {
    header, .tile { animation: none; }
  }
</style>

<header>
  <img class="logo" src="/static/logo.png" alt="HR Academy" width="1036" height="381">
  <h1>Dashboard</h1>
  <p class="who">Welcome, {{ user.name }}</p>
  <p class="meta">
    <i class="ti ti-users" aria-hidden="true"></i>{{ student_count }} students · {{ today }}
  </p>
  <a class="logout" href="/logout">Log out</a>
</header>

<nav class="tiles">
  <a class="tile" href="/entries">
    <i class="ti ti-checkbox" aria-hidden="true"></i>
    <span class="tile-text">
      <span class="tile-title">Today's entries</span>
      <span class="tile-sub">Attendance, topics, scores</span>
    </span>
    <i class="ti ti-chevron-right" aria-hidden="true"></i>
  </a>
  <a class="tile" href="/students/new">
    <i class="ti ti-user-plus" aria-hidden="true"></i>
    <span class="tile-text">
      <span class="tile-title">Onboard a new student</span>
      <span class="tile-sub">Name, roll number, slot</span>
    </span>
    <i class="ti ti-chevron-right" aria-hidden="true"></i>
  </a>
  <div class="tile soon">
    <i class="ti ti-chart-bar" aria-hidden="true"></i>
    <span class="tile-text">
      <span class="tile-title">Student data</span>
    </span>
    <span class="soon-chip">Soon</span>
  </div>
</nav>
