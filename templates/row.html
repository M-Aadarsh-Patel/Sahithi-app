
<li id="row-{{ student._id }}"
    class="row is-{{ entry.status or 'unmarked' }}"
    data-status="{{ entry.status or 'unmarked' }}"
    hx-target="#row-{{ student._id }}"
    hx-swap="outerHTML"
    hx-sync="closest li:replace"
    hx-vals='{"student_id": "{{ student._id }}", "date": "{{ date }}"}'>
  <span class="name">{{ student.name }}</span>
  <span class="roll">{{ student.roll_no }}</span>
  <button class="present" onclick="optimistic(this, 'present')"
          hx-post="/entries" hx-vals='{"status": "present"}'>present</button>
  <button class="absent" onclick="optimistic(this, 'absent')"
          hx-post="/entries" hx-vals='{"status": "absent"}'>absent</button>

  <span class="tick" {% if not saved %}hidden{% endif %}>✓</span>

  <div class="more">
    <div class="more-body">
      <input class="topic" name="slot_1" value="{{ entry.slot_1 or '' }}"
             placeholder="slot 1" autocomplete="off"
             hx-post="/entries" hx-trigger="blur" hx-swap="none" hx-sync="this:replace">
      <input class="topic" name="slot_2" value="{{ entry.slot_2 or '' }}"
             placeholder="slot 2" autocomplete="off"
             hx-post="/entries" hx-trigger="blur" hx-swap="none" hx-sync="this:replace">

      {% set absent = entry.status == 'absent' %}
      <span class="marks-label" aria-hidden="true">Test Score</span>
      <input class="mark" name="score" type="number" inputmode="numeric"
             placeholder="score" aria-label="Test score" autocomplete="off"
             {% if absent %}disabled{% endif %}
             value="{{ '' if absent else (entry.score if entry.score is not none else '') }}"
             hx-post="/entries" hx-trigger="blur" hx-swap="none" hx-sync="this:replace">
      <span class="slash" aria-hidden="true">/</span>
      <input class="mark" name="max_marks" type="number" inputmode="numeric"
             placeholder="max marks" aria-label="Test score, out of" autocomplete="off"
             {% if absent %}disabled{% endif %}
             value="{{ '' if absent else (entry.max_marks if entry.max_marks is not none else '') }}"
             hx-post="/entries" hx-trigger="blur" hx-swap="none" hx-sync="this:replace">

      <input class="remark" name="remark" value="{{ entry.remark or '' }}"
             placeholder="Remark" aria-label="Remark" autocomplete="off"
             hx-post="/entries" hx-trigger="blur" hx-swap="none" hx-sync="this:replace">
    </div>
  </div>

  <button class="retry" type="button">retry</button>
</li>
